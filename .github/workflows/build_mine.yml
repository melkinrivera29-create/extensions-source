name: Build mine
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - name: Build tmohentai only
        run: ./gradlew :src:es:tmohentai:assembleDebug
      - name: Upload only my apk
        uses: actions/upload-artifact@v4
        with:
          name: tmohentai
          path: src/es/tmohentai/build/outputs/apk/debug/*.apk
